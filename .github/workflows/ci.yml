name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System fonts and cairo (text metrics, SVG rasterising)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fontconfig fonts-liberation libcairo2
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest -q
